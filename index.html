<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<!-- Telefonis: leht täpselt ekraani laiune, ilma suurenduseta -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viskemäng</title>

<!-- Kirjatüüp Google Fonts'ist -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<!-- ===================================================================
     STIILID (CSS) – kuidas ekraani tekstid välja näevad
     Vastutaja: LIIDESE TEGIJA
     =================================================================== -->
<style>
*{box-sizing:border-box}
/* Terve leht: taust, tekstivärv, ei saa kerida ega teksti valida */
body{margin:0;background:#EDF1EE;color:#12291F;
  font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
/* Mänguala üle terve ekraani; touch-action:none = telefon ei keri ega suurenda */
#stage{position:relative;width:100vw;height:100vh;touch-action:none}
canvas{display:block}
/* Ülemine rida: punktid, seeria, rekord */
.hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;
  display:flex;gap:14px;align-items:baseline;pointer-events:none}
.hud .k{font-size:12px;color:#4A6357;display:block;line-height:1}
.hud .v{font-size:26px;font-weight:700;font-family:ui-monospace,Menlo,monospace;line-height:1.1}
.hud .best{margin-left:auto;text-align:right}
.pickers{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;pointer-events:auto}
.object-picker,.environment-picker{display:flex;align-items:center;gap:7px}
.object-picker span,.environment-picker span,.surface-picker span{font-size:12px;color:#4A6357}
.object-picker select,.environment-picker select,.surface-picker select{max-width:34vw;padding:7px 9px;border:1px solid #CBD8D2;
  border-radius:8px;background:#fff;color:#12291F;font:inherit}
.object-picker select:disabled,.environment-picker select:disabled,.surface-picker select:disabled{opacity:.65}
.game-actions{position:absolute;top:62px;right:16px;display:flex;gap:8px;pointer-events:auto}
.game-actions button{padding:8px 11px;border:1px solid #CBD8D2;border-radius:8px;
  background:#fff;color:#12291F;font:500 13px "Space Grotesk",system-ui,sans-serif;cursor:pointer}
.gravity-picker{position:relative}
#gravityMenu{position:absolute;top:calc(100% + 5px);right:0;z-index:3;min-width:190px;
  padding:4px;background:#fff;border:1px solid #CBD8D2;border-radius:8px;
  box-shadow:0 4px 12px #12291f22}
#gravityMenu[hidden]{display:none}
#gravityMenu button{display:block;width:100%;text-align:left;border:0}
#gravityMenu button:hover{background:#EDF1EE}
@media(max-width:600px){
  .pickers{top:58px;gap:6px;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
  .object-picker,.environment-picker{gap:4px}
  .game-actions{top:200px}
}
.streak{color:#C4603C}
/* Suur teade keset ekraani ("Sisse!", "Mööda"). Nähtav ainult klassiga "on" */
#msg{position:absolute;left:0;right:0;top:36%;text-align:center;
  font-size:34px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .18s}
#msg.on{opacity:1}
/* Vihje ekraani all */
#hint{position:absolute;left:0;right:0;bottom:26px;text-align:center;
  font-size:15px;color:#4A6357;pointer-events:none}
/* Võimsusriba ekraani allservas. Nähtav ainult tõmbamise ajal */
#power{position:absolute;left:16px;right:16px;bottom:12px;height:6px;
  background:#CBD8D2;border-radius:3px;overflow:hidden;opacity:0;transition:opacity .15s}
#power i{display:block;height:100%;width:0;background:#D97757}
#power.on{opacity:1}
</style>
</head>
<body>

<!-- ===================================================================
     EKRAANI OSAD (HTML)
     3D-pilt pannakse #stage sisse (stseen.js). Teised osad on selle peal.
     =================================================================== -->
<div id="stage">
  <!-- Punktid, seeria ja rekord. Numbreid uuendab menuu.js -->
  <div class="hud">
    <div><span class="k">Punktid</span><span class="v" id="hScore">0</span></div>
    <div><span class="k">Seeria</span><span class="v streak" id="hStreak">0</span></div>
    <div class="best"><span class="k">Rekord</span><span class="v" id="hBest">0</span></div>
    <div class="pickers">
      <label class="object-picker" for="objectSelect">
        <span>Ese</span>
        <select id="objectSelect">
          <option value="robot">Robot</option>
          <option value="ball">Pall</option>
          <option value="rock">Kivi</option>
          <option value="paperPlane">Paberlennuk</option>
          <option value="pen">Pastakas</option>
          <option value="pencilCase">Pinal</option>
          <option value="pencil">Pliiats</option>
          <option value="pillow">Padi</option>
        </select>
      </label>
      <label class="environment-picker" for="environmentSelect">
        <span>Koht</span>
        <select id="environmentSelect">
          <option value="earth">Maa</option>
          <option value="moon">Kuu</option>
          <option value="classroom">Klassiruum</option>
        </select>
      </label>
      <label class="surface-picker" for="surfaceSelect">
        <span>Pind</span>
        <select id="surfaceSelect">
          <option value="normal">Tavaline</option>
          <option value="rubber">Kummipõrand</option>
          <option value="mud">Muda</option>
          <option value="sand">Liiv</option>
        </select>
      </label>
    </div>
  </div>
  <div class="game-actions">
    <div class="gravity-picker">
      <button id="gravityButton" type="button" aria-expanded="false" aria-controls="gravityMenu">Gravitatsioon: Maa</button>
      <div id="gravityMenu" hidden></div>
    </div>
    <button id="restartButton" type="button">Alusta viset uuesti</button>
  </div>
  <!-- Suur teade keset ekraani -->
  <div id="msg"></div>
  <!-- Vihje ekraani all -->
  <div id="hint">Hoia vasakut hiirenuppu või sõrme all, tõmba üles ja lase lahti</div>
  <!-- Võimsusriba -->
  <div id="power"><i id="powerFill"></i></div>
</div>

<!-- ===================================================================
     KOODIFAILID
     JÄRJEKORD ON TÄHTIS: iga fail võib kasutada ainult seda, mis on
     juba enne teda laaditud. three.js esimesena, mang.js viimasena.
     =================================================================== -->
<!-- 3D-teek three.js, versioon r128. ÄRA UUENDA versiooni! -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="seaded.js"></script>    <!-- ÜHINE:     kõik numbrid ja seaded -->
<script src="menuu.js"></script>     <!-- LIIDES:    punktid, teated, (hiljem menüü) -->
<script src="heli.js"></script>      <!-- LIIDES:    helid -->
<script src="stseen.js"></script>    <!-- KUNSTNIK:  taust, kaamera, valgus, põrand -->
<script src="objektid.js"></script>  <!-- KUNSTNIK:  tops, alustass, robot -->
<script src="fuusika.js"></script>   <!-- FÜÜSIK:    lend, põrkamine, tabamine -->
<script src="juhtimine.js"></script> <!-- LIIDES:    hiir ja sõrm -->
<script src="mang.js"></script>      <!-- ÜHINE:     põhitsükkel, käivitab mängu -->

</body>
</html>
